name: Update votes

on:
  schedule:
    # 06:30 UTC daily — 30 min after update-bills so freshly published
    # bill records land before the votes that reference them by bill_id.
    # Independent concurrency group; a bills outage doesn't block votes.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-votes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Runs are incremental (already-published roll calls are never
    # refetched), so steady state is a handful of detail fetches. A
    # from-scratch backfill of the whole Congress is ~860 Senate + several
    # hundred House detail XMLs (capped at 1000/run by --max-new; the tail
    # rolls over to the next run) — 45 minutes covers a capped run
    # comfortably.
    timeout-minutes: 45
    steps:
      - name: Checkout
        # See update-bills.yml — PAT needed so the push-back step can
        # bypass the "main branch" ruleset (GITHUB_TOKEN can't).
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      # --- Python tooling (build_dashboard.py only — fetch-votes is
      # Kotlin-canonical; see issue #73) ---

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: data-pipeline/requirements.txt

      - name: Install Python dependencies
        run: uv pip install --system -r data-pipeline/requirements.txt

      # --- Kotlin tooling (canonical, writes to docs/data/) ---

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Kotlin: canonical fetch (Senate LIS XML, House clerk EVS
      # XML, and legislators YAMLs all need no API key). fetch-votes is
      # incremental against the files already on disk (a vote already
      # present is never refetched), so it picks up from the last
      # successful run's output (committed by `safe-push`). The bills
      # manifests are re-attached in place too: the driver re-attaches
      # the derived per-bill `votes` refs to the manifest in the output
      # dir when new roll calls land (issue #19). ---

      - name: Fetch votes (Kotlin)
        working-directory: pipeline
        # --output-dir must be absolute: this step's working directory
        # is the pipeline/ subproject dir, so the default (docs/data)
        # would resolve to the nonexistent pipeline/docs/data.
        run: ./gradlew :cli:run --args="fetch-votes --output-dir $GITHUB_WORKSPACE/docs/data" --no-daemon

      - name: Rebuild pipeline dashboard
        if: always()
        run: python data-pipeline/scripts/build_dashboard.py

      - name: Commit updated votes
        uses: ./.github/actions/safe-push
        with:
          # congress*_bills.json: fetch-votes re-attaches the derived
          # per-bill `votes` refs to the bills manifest whenever new roll
          # calls land (issue #19).
          paths: |
            docs/data/votes
            docs/data/congress*_votes.json
            docs/data/congress*_bills.json
            docs/pipeline.html
          message: "Update votes [bot]"
