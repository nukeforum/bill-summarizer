name: Update session calendar

on:
  schedule:
    # 05:30 UTC daily — runs 30 min before update-bills so a calendar
    # outage doesn't block the bills commit, and a bills outage doesn't
    # block calendar freshness. Independent concurrency group.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-session-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # See update-bills.yml — PAT needed so the push-back step can
        # bypass the "main branch" ruleset (GITHUB_TOKEN can't).
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      # --- Python tooling (build_dashboard.py only —
      # build-session-calendar is Kotlin-canonical; see issue #73) ---

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: data-pipeline/requirements.txt

      - name: Install Python dependencies
        run: uv pip install --system -r data-pipeline/requirements.txt

      # --- Kotlin tooling (canonical, writes to docs/data/) ---

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Kotlin: canonical build ---

      - name: Build session calendar (Kotlin)
        working-directory: pipeline
        # --output-dir must be absolute: this step's working directory
        # is the pipeline/ subproject dir, so the default (docs/data)
        # would resolve to the nonexistent pipeline/docs/data.
        run: ./gradlew :cli:run --args="build-session-calendar --output-dir $GITHUB_WORKSPACE/docs/data" --no-daemon

      - name: Rebuild pipeline dashboard
        if: always()
        run: python data-pipeline/scripts/build_dashboard.py

      - name: Commit updated calendar
        uses: ./.github/actions/safe-push
        with:
          paths: |
            docs/data/session_calendar.json
            docs/pipeline.html
          message: "Update session calendar [bot]"
